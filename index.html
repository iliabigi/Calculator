<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC</title>
    <script defer src = "./script.js"></script>
    <link href="./styles.css" rel="stylesheet">
</head>

<body>
   
    <div class="calc-body">
         <div class="calc-display">
            <p id="display"></p>
        </div>
        <div class="calc-buttons">
            <div class="row row1">
                <button>0</button>
                <button>.</button>
                <button>AC</button>
                <button>=</button>
            </div>
            <div class="row row2">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
            </div>
            <div class="row row3">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>
            <div class="row row4">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
            </div>
            <div class="row row5">
                <button>START</button>
                <button>STOP</button>
                <button>C</button>
                <button>/</button>
            </div>
        </div>
    </div>
    
</body>
</html>
